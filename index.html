<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>TIC! TAC!! TOE!!</title>
</head>
<body>
    <div class="gameForm"><span id="noGame"></span>
        <button command="show-modal" commandfor="setInfo" id="reset">Wanna play?</button>
        <dialog id="setInfo">
            <form method="post">
                
                <label class="switch" for="whoMark">
                    <input type="checkbox" id="whoMark" name="whoMark">
                    <span class="slider round">
                        <svg class="xo" width="35" height="35">
                            <line x1="17"y1="5"x2="17"y2="30" stroke="white" stroke-width="4"/>
                            <line x1="30"y1="17"x2="5"y2="17" stroke="white" stroke-width="4"/>
                        </svg>  
                                        
                        <svg class="xoxo" width="35" height="35">
                            <line x1="17"y1="5"x2="17"y2="30" stroke="white" stroke-width="4"/>
                            <line x1="30"y1="17"x2="5"y2="17" stroke="white" stroke-width="4"/>
                        </svg>
                    </span>
                </label>  

                <label for="name1">Player #1:</label>
                <input type="text" id="name1" name="name1" placeholder="Ginni" maxlength="10" required>
                <label for="name2">Player #2:</label>
                <input type="text" id="name2" name="name2" placeholder="Bo" maxlength="10" required> 
                <button type="submit" id="onGame">Let's go!</button>
            </form>
            <button  commandfor="setInfo" command="close">Nah.</button>
        </dialog>
    </div>
    <h1>Tic-Tac ⏱️ Toe</h1>
    <div class="game">
        <div class="uiBoard">
        </div>
    </div>
    <div class="chatbox">
        <dl id="uiLog">
        </dl>
    </div>
    <script src="jscript.js"></script>
</body>
</html>
