<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>TIC! TAC!! TOE!!</title>
</head>
<body>
    <div class="form">
        <button command="show-modal" commandfor="setInfo">Wanna play?</button>

        <dialog id="setInfo">
        <form method="post">
            <label class="switch" for="whoMark">
                <input type="checkbox" id="whoMark" name="whoMark">
                <span class="slider round"></span>
            </label>  

            <label for="name1">Player #1:</label>
            <input type="text" id="name1" name="name1" placeholder="Ginni" required>
            <label for="name2">Player #2:</label>
            <input type="text" id="name2" name="name2" placeholder="Bo" required> 

            <button type="submit">Let's go!</button>
        </form>
        <button  commandfor="setInfo" command="close">Nah.</button>
        </dialog>
    </div>
    <h1>Tic-Tac</h1>
    <div class="game">
        <div class="board"><button>❌</button><button>⭕</button><button>❌</button></div>
    </div>
    <div class="chatbox">
        <dl>
            <dt><h2>Referee says;</h2></dt>
        </dl>
    </div>

    <script src="jscript.js"></script>
</body>
</html>
